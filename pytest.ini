[pytest]
# Pytest configuration for UI testing

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# UI testing specific options
# Use QT_QPA_PLATFORM=offscreen to run tests without displaying windows
# This is useful for CI/CD environments
env = 
    QT_QPA_PLATFORM=offscreen

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Markers for categorizing tests
markers =
    ui: Tests for UI components
    integration: Integration tests
    unit: Unit tests
    slow: Slow running tests
    authentication: Tests related to authentication
    navigation: Tests for screen navigation
    charts: Tests for chart functionality